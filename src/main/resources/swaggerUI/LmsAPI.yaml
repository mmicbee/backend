  /api/payments/webhook:
    post:
      tags:
        - Payments
      summary: Paystack webhook endpoint
      description: Webhook endpoint for Paystack to notify payment status changes
      parameters:
        - name: x-paystack-signature
          in: header
          required: true
          schema:
            type: string
          description: Paystack signature for webhook verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: "charge.success"
                data:
                  type: object
                  properties:
                    reference:
                      type: string
                      example: "PAY_ABC123XYZ"
                    status:
                      type: string
                      example: "success"
                    amount:
                      type: integer
                      example: 5000
                    currency:
                      type: string
                      example: "NGN"
                    customer:
                      type: object
                      properties:
                        email:
                          type: string
                          example: "john.doe@example.com"
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Invalid webhook data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

