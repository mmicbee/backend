# Server Configuration
server.port=${PORT:8080}

# App Profile & Name
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.application.name=${SPRING_APPLICATION_NAME:backend}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# --- HikariCP Settings ---
spring.datasource.hikari.pool-name=BackendHikariPool
spring.datasource.hikari.maximum-pool-size=10      
spring.datasource.hikari.idle-timeout=300000       
spring.datasource.hikari.max-lifetime=1800000       
spring.datasource.hikari.connection-timeout=30000   
spring.datasource.hikari.auto-commit=true



# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false


# Logging
logging.level.com.zone01kisumu.backend=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Security
spring.security.user.name=${SPRING_SECURITY_USERNAME:admin}
spring.security.user.password=${SPRING_SECURITY_PASSWORD:admin}

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}   


# CORS Configuration (add the urls you want to allow)
cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://lms-ujuzi.vercel.app}
# Frontend Base URL for googleoauth callback
frontend.url=${FRONTEND_URL:http://localhost:5173}
frontend.oauth.callback.full-url=${FRONTEND_OAUTH_CALLBACK_URL:http://localhost:5173/oauth/callback}


# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}

# Paystack Configuration
paystack.secret.key=${PAYSTACK_SECRET_KEY:}
paystack.public.key=${PAYSTACK_PUBLIC_KEY:}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}

# M-Pesa Configuration (supports both MPESA_CONSUMER_KEY and MPESA_APP_KEY naming conventions)
mpesa.app-key=${MPESA_CONSUMER_KEY:${MPESA_APP_KEY:}}
mpesa.app-secret=${MPESA_CONSUMER_SECRET:${MPESA_APP_SECRET:}}
mpesa.business-shortcode=${MPESA_BUSINESS_SHORTCODE:174379}
mpesa.passkey=${MPESA_PASSKEY:}
mpesa.callback-url=${MPESA_CALLBACK_URL:http://localhost:8080/api/mpesa/callback}
mpesa.env=${MPESA_ENV:sandbox}
mpesa.initiator-name=${MPESA_INITIATOR_NAME:}
mpesa.security-credential=${MPESA_SECURITY_CREDENTIAL:}
mpesa.sender-short-code=${MPESA_SENDER_SHORT_CODE:174379}
mpesa.result-url=${MPESA_RESULT_URL:http://localhost:8080/api/mpesa/result}
mpesa.timeout-url=${MPESA_TIMEOUT_URL:http://localhost:8080/api/mpesa/timeout}

# H2 Console Configuration
spring.h2.console.enabled=true

# Email Configuration for OTP
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=150MB

# Backup & Disaster Recovery Configuration
backup.enabled=${BACKUP_ENABLED:true}
backup.storage-directory=${BACKUP_STORAGE_DIR:./backups}
backup.schedule-cron=${BACKUP_SCHEDULE_CRON:0 0 2 * * *}
backup.encryption-enabled=${BACKUP_ENCRYPTION_ENABLED:true}
backup.encryption-secret=${BACKUP_ENCRYPTION_SECRET:Ujuzi360SecureBackupPassphrase2026}
backup.retention-max-count=${BACKUP_RETENTION_MAX_COUNT:7}

# Course file storage configuration
app.storage.provider=${APP_STORAGE_PROVIDER:local}
app.storage.local-directory=${APP_STORAGE_LOCAL_DIRECTORY:./uploads}
app.storage.base-url=${APP_STORAGE_BASE_URL:http://localhost:8080}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:}
app.storage.s3.region=${APP_STORAGE_S3_REGION:us-east-1}
app.storage.s3.endpoint=${APP_STORAGE_S3_ENDPOINT:}
